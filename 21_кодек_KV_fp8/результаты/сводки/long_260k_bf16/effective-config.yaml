schema_version: 1
targets:
  qwen35_api:
    protocol: openai_chat
    base_url: http://127.0.0.1:18080/v1
    model: qwen3.6-35b-a3b
    max_concurrency: 1
    request:
      timeout_seconds: 86400.0
      retries: 2
      retry_interval_seconds: 10.0
      headers: {}
suites:
  standard:
    jobs:
    - id: needle_standard
      backend: evalscope
      dataset: needle_haystack
      repeats: 1
      generation:
        temperature: 0
        max_tokens: 512
        seed: 42
        extra_body:
          enable_thinking: false
      backend_args:
        subset_list:
        - english
        - chinese
        judge_strategy: rule
        dataset_args:
          local_path: /root/.cache/modelscope/datasets/AI-ModelScope--Needle-in-a-Haystack-Corpus/snapshots/master
          extra_params:
            context_lengths_min: 1000
            context_lengths_max: 32000
            context_lengths_num_intervals: 10
            document_depth_percent_min: 0
            document_depth_percent_max: 100
            document_depth_percent_intervals: 10
            tokenizer_path: /root/.cache/modelscope/models/Qwen--Qwen3.6-35B-A3B/snapshots/master
            show_score: true
      target: qwen35_api
      max_concurrency: 1
