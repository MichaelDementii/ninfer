schema_version: 1

targets:
  qwen35_api:
    protocol: openai_chat
    base_url: http://127.0.0.1:18080/v1
    model: qwen3.6-35b-a3b
    max_concurrency: 4
    request:
      timeout_seconds: 86400
      retries: 2
      retry_interval_seconds: 10

suites:
  aime25:
    jobs:
      - id: aime25
        backend: evalscope
        dataset: aime25
        target: qwen35_api
        max_concurrency: 4
        generation:
          temperature: 0.6
          top_p: 0.95
          top_k: 20
          presence_penalty: 1.0
          frequency_penalty: 0.0
          max_tokens: 65536
          seed: 31337
        backend_args:
          judge_strategy: rule
          dataset_hub: modelscope
  aime26:
    jobs:
      - id: aime26
